name: nominatim

project_files:
  - docker-compose.nominatim.yaml
  - docker-compose.nominatim-ui.yaml
  - commands/nominatim/nominatim
  - commands/host/nominatim-ui

ddev_version_constraint: '>= v1.24.10'

pre_install_actions:
  - |
    # Create default .env.nominatim if it doesn't exist
    if [ ! -f .ddev/.env.nominatim ]; then
      cat > .ddev/.env.nominatim << 'ENVEOF'
    # Nominatim configuration for DDEV
    # See https://github.com/bradley-tran/ddev-nominatim for documentation
    #
    # Customize using: ddev dotenv set .ddev/.env.nominatim --<flag>=<value>
    # Then restart: ddev restart
    #
    # NOMINATIM_DOCKER_IMAGE="mediagis/nominatim:5.3"
    # NOMINATIM_PBF_URL="https://download.geofabrik.de/europe/monaco-latest.osm.pbf"
    # NOMINATIM_PBF_PATH=""
    # NOMINATIM_IMPORT_STYLE="full"
    # NOMINATIM_PASSWORD="nominatim"
    # NOMINATIM_THREADS=2
    # NOMINATIM_HTTP_PORT=8980
    # NOMINATIM_HTTPS_PORT=8943
    # NOMINATIM_UI_HTTP_PORT=8765
    # NOMINATIM_UI_HTTPS_PORT=8744
    # NOMINATIM_UI_VERSION="3.12.0"
    # NOMINATIM_UI_PAGE_TITLE="Nominatim"
    # NOMINATIM_UI_DOCKER_IMAGE="nginx:alpine"
    ENVEOF
    elif ! grep -q "NOMINATIM_UI_" .ddev/.env.nominatim; then
      cat >> .ddev/.env.nominatim << 'ENVEOF'
    # NOMINATIM_UI_HTTP_PORT=8765
    # NOMINATIM_UI_HTTPS_PORT=8744
    # NOMINATIM_UI_VERSION="3.12.0"
    # NOMINATIM_UI_PAGE_TITLE="Nominatim"
    # NOMINATIM_UI_DOCKER_IMAGE="nginx:alpine"
    ENVEOF
    fi

post_install_actions:
  - |
    echo ""
    echo "✅ Nominatim add-on installed successfully!"
    echo ""
    echo "By default, Nominatim will download and import Monaco OSM data."
    echo "To import a different region, run:"
    echo "  ddev dotenv set .ddev/.env.nominatim --nominatim-pbf-url=\"https://download.geofabrik.de/europe/germany-latest.osm.pbf\""
    echo ""
    echo "Then start or restart DDEV:"
    echo "  ddev restart"
    echo ""
    echo "Note: The initial start will import OSM data in the background without blocking."
    echo "You can monitor import progress with:"
    echo "  ddev logs -s nominatim -f"
    echo ""
    echo "Once ready, access:"
    echo "  - API:    https://<projectname>.ddev.site:8943"
    echo "  - Web UI: https://<projectname>.ddev.site:8744 (or run 'ddev nominatim-ui')"
    echo ""
